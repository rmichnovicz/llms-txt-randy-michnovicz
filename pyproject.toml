[project]
name = "brief"
version = "0.1.0"
description = "Guided llms.txt generation and evaluation"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "markdown-it-py>=3,<5",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "trafilatura>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "types-defusedxml>=0.7",
    "types-lxml>=2025",
]

[project.scripts]
brief-eval = "brief.evals:main"
brief = "brief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an isolated Postgres database via TEST_DATABASE_URL"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["ANN", "I"]
# Heterogeneous SQL rows, JSON documents, and adapter kwargs have explicit Any values.
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "evals", "scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
